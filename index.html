<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Yuri House 3D v4</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="ui">
  <div class="title">Yuri House 3D <b>v4</b><small>2026/06/26 修正図面ベース</small></div>

    <button data-view="outside" class="active">外観</button><button data-view="all">全体</button>
    <button data-view="f1">1階</button><button data-view="f2">2階</button><button data-view="walk">室内</button>
  </div>
  <div class="row">
    <button id="roof">屋根 ON</button><button id="labels">部屋名 ON</button><button id="walls">壁 ON</button>
  </div>
  <small>ドラッグ: 回転 / ピンチ: ズーム / 室内: ドラッグで視点変更</small>
</div>
<div id="badge">図面トレース v4</div>
