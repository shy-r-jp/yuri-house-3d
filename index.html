<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e9eef4">
<title>Yuri House 3D v5.1</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div id="app"></div>

<div class="panel">
  <div class="title">Yuri House 3D <span>v5.1</span></div>
  <div class="sub">2026/06/26 修正図面ベース / iPhone安定版</div>
  <div class="row">
    <button data-floor="1" class="active">1階</button>
    <button data-floor="2">2階</button>
    <button data-floor="all">全体</button>
  </div>
  <div class="row">
    <button data-view="orbit" class="active">見回す</button>
    <button data-view="top">真上</button>
    <button data-view="walk">室内</button>
  </div>
  <div class="row">
    <button id="roofBtn">屋根 OFF</button>
    <button id="labelBtn" class="active">部屋名 ON</button>
    <button id="equipBtn" class="active">設備 ON</button>
  </div>
  <div class="help">ドラッグで回転 / ピンチ・ホイールでズーム。v4の安定構成をベースに、ドアとテクスチャを追加。</div>
</div>

<div id="status">v5.1 ready</div>

<script type="importmap">
{
  "imports":{
    "three":"https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
    "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
  }
}
</script>
<script type="module" src="./app.js"></script>
</body>
</html>
