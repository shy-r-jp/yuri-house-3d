    box(common,0,0,BW+.15,BD+.15,.45,-.45,M.foundation);for(let i=0;i<3;i++)box(common,4.05,5.05+i*.20,1.65,.30,.12,i*.08,M.tile);for(const [x,z] of [[-5.55,4.65],[-3.95,4.65],[5.75,-3.4],[5.75,-1.8]]){box(common,x,z,.62,.25,.58,.02,M.frame);box(common,x,z+.14,.42,.04,.42,.10,M.trim)}
    labels1.visible=labels2.visible=false;

    let floorMode='all',roofOn=true,labelsOn=false,gridOn=false;
    function sync(){const one=floorMode==='1',two=floorMode==='2';f1.visible=!two;f2.visible=!one;details1.visible=!two;details2.visible=!one;roof.visible=roofOn&&!one;labels1.visible=labelsOn&&!two;labels2.visible=labelsOn&&!one;if(one){f2.visible=false;details2.visible=false;roof.visible=false}if(two){f1.visible=false;details1.visible=false;roof.visible=false}}
    document.querySelectorAll('[data-floor]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-floor]').forEach(x=>x.classList.remove('active'));b.classList.add('active');floorMode=b.dataset.floor;roofOn=floorMode==='all';document.getElementById('roofBtn').classList.toggle('active',roofOn);document.getElementById('roofBtn').textContent='屋根 '+(roofOn?'ON':'OFF');sync()});
    document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-view]').forEach(x=>x.classList.remove('active'));b.classList.add('active');const v=b.dataset.view;if(v==='iso')camera.position.set(16,12,18);if(v==='top')camera.position.set(0,29,.01);if(v==='front')camera.position.set(0,6.3,24);controls.target.set(0,2.4,0);controls.update()});
    document.getElementById('roofBtn').onclick=e=>{roofOn=!roofOn;e.currentTarget.classList.toggle('active',roofOn);e.currentTarget.textContent='屋根 '+(roofOn?'ON':'OFF');sync()};
    document.getElementById('labelBtn').onclick=e=>{labelsOn=!labelsOn;e.currentTarget.classList.toggle('active',labelsOn);e.currentTarget.textContent='部屋名 '+(labelsOn?'ON':'OFF');sync()};
    document.getElementById('gridBtn').onclick=e=>{gridOn=!gridOn;drawing.visible=gridOn;e.currentTarget.classList.toggle('active',gridOn);e.currentTarget.textContent='図面線 '+(gridOn?'ON':'OFF')};
    addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});sync();(function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)})();
  </script>
</body>
</html>
