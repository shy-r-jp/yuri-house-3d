<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111820">
  <title>Yuri House 3D</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="app"></div>

  <header class="topbar">
    <div>
      <h1>Yuri House 3D <span>v5</span></h1>
      <p>2026/06/26 修正図面ベース</p>
    </div>
    <nav>
      <button data-mode="outside" class="active">外観</button>
      <button data-mode="f1">1階俯瞰</button>
      <button data-mode="f2">2階俯瞰</button>
    </nav>
  </header>

  <aside class="sidebar">
    <section>
      <h2>表示設定</h2>
      <label>設備表示 <input id="equipToggle" type="checkbox" checked></label>
      <label>部屋名表示 <input id="labelToggle" type="checkbox" checked></label>
      <label>断面表示 <input id="cutToggle" type="checkbox"></label>
    </section>
    <section>
      <h2>視点切替</h2>
      <div class="grid2">
        <button data-side="south" class="active">南側</button>
        <button data-side="north">北側</button>
        <button data-side="east">東側</button>
        <button data-side="west">西側</button>
      </div>
    </section>
    <section>
      <h2>操作</h2>
      <p>ドラッグ：回転</p>
      <p>ピンチ：ズーム</p>
      <p>2本指ドラッグ：移動</p>
    </section>
  </aside>

  <aside class="plans">
    <div class="planCard">
      <h3>1階 平面図</h3>
      <div class="miniPlan" id="miniF1"></div>
    </div>
    <div class="planCard">
      <h3>2階 平面図</h3>
      <div class="miniPlan" id="miniF2"></div>
    </div>
  </aside>

  <section class="walkthrough">
    <h2>1階 ウォークスルー</h2>
    <div class="chips" id="chips1"></div>
    <h2>2階 ウォークスルー</h2>
    <div class="chips" id="chips2"></div>
  </section>

  <div class="hint">ドラッグ：回転　ピンチ：ズーム　2本指ドラッグ：移動</div>

  <script type="importmap">
  {"imports":{
    "three":"https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
    "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
  }}
  </script>
  <script type="module" src="./app.js"></script>
</body>
</html>
